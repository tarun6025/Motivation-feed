name: Update online quote feed

on:
  schedule:
    # GitHub cron uses UTC. These two triggers cover 01:00 in Germany
    # during both Central European summer and winter time.
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-online-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check German local time
        id: local_time
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "$(TZ=Europe/Berlin date +%H)" == "01" ]]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.local_time.outputs.run_update == 'true'
        uses: actions/checkout@v4

      - name: Fetch and validate quotes
        if: steps.local_time.outputs.run_update == 'true'
        run: python tools/update_online_quotes.py

      - name: Commit changed feed
        if: steps.local_time.outputs.run_update == 'true'
        run: |
          if git diff --quiet -- online/quotes.json; then
            echo "Quote feed is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online/quotes.json
          git commit -m "chore: refresh online quote feed"
          git push
