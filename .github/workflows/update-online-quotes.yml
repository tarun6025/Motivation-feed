name: Update online quote feed

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-online-quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and validate quotes
        run: python tools/update_online_quotes.py

      - name: Commit changed feed
        run: |
          if git diff --quiet -- online/quotes.json; then
            echo "Quote feed is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online/quotes.json
          git commit -m "chore: refresh online quote feed"
          git push
